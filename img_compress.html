<html lang="en">

<head>
  <!-- Required meta tags -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Image Compressor</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,300;1,400;1,500;1,600;1,700;1,800;1,900&amp;display=swap"
    rel="stylesheet">
    
  <!-- Bootstrap CSS -->
  <link href="bootstrap.css" rel="stylesheet">

  <!-- Style css -->
  <link href="style.css" rel="stylesheet">

  <style>
    body {
      padding-top: 50px;
    }

    .imgCompresser {
      position: relative;
      min-height: 100vh;
    }

    .imgCompresser .container {
      max-width: 960px;
    }

    .imgCompresser h1 {
      font-family: 'Pacifico', cursive;
      font-size: 36px;
      font-weight: 500;
      margin: 0;
    }

    .imgCompresser h5 {
      font-weight: 400;
      font-size: 15px;
    }

    .imgCompresser .btn {
      padding: 8px 20px;
      border-radius: 30px;
    }

    .imgCompresser .input-group.w-50 {
      width: 50%;
      margin: 0 auto;
    }

    .imgCompresser .form-control {
      border-color: #edecec;
      text-transform: capitalize;
      padding: 15px 20px;
      color: #a6b4c8;
    }

    #appendImg img {
      object-fit: cover;
    }

    #appendImgConverted .imgWrapper {
      max-width: 100%;
      text-align: right;
      margin-right: 0;
      margin-left: auto;
    }

    .imgWrapper img {
      max-height: 150px;
      width: 280px;
      object-fit: cover;
    }

    #appendImgConverted strong {
      display: inline-block;
      min-width: 95px;
    }

    div#loader {
      display: none;
      position: fixed;
      left: 0;
      right: 0;
      top: 0;
      bottom: 0;
      width: 100%;
      height: 100%;
      background: rgba(255, 255, 255, 0.8);
      z-index: 9;
    }

    div#loader .loaderWrap {
      position: fixed;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 15px;
    }

    div#loader img {
      margin: 0 auto;
    }

    #uploadItem {
      padding-left: 15px;
      text-align: center;
    }

    @media(max-width:575px) {
      body {
        padding-top: 0;
      }

      div#loader .loaderWrap {
        width: 95%;
      }

      div#loader .loaderWrap img {
        width: 100%;
      }

      .customContainer {
        width: 100%;
        max-width: 100%;
      }

      .imgCompresser h1 {
        font-size: 32px;
      }

      .imgCompresser .input-group.w-50 {
        width: 95% !important;
      }

      .imgWrapper {
        text-align: center;
      }

      .imgWrapper img {
        width: 100%;
        min-width: 100%;
        height: auto;
        min-height: auto;
      }

      #appendImgConverted strong {
        min-width: unset;
      }

      #appendImgConverted .imgWrapper {
        position: relative;
        padding-bottom: 23px;
      }

      .imgWrapper strong {
        font-size: 15px;
        font-weight: 500;
        display: block;
        margin: 0 !important;
        margin-left: 15px;
      }

      #appendImgConverted .imgWrapper strong {
        white-space: nowrap;
        position: absolute;
        bottom: 0;
        left: 50%;
        transform: translateX(-50%);
      }
    }
  </style>

</head>

<body cz-shortcut-listen="true">
  <div id="loader">
    <div class="loaderWrap">
      <h1 id="uploadItem"></h1>
      <img id="uploadImg" src="img_load.gif" alt="loader"
        width="500" style="display: block;">
      <img id="convertImg" src="compress.gif" alt="loader"
        width="400" class="mt-4" style="display: none;">
    </div>
  </div>
  <section class="imgCompresser">
    <div class="container">
      <div class="row">
        <div class="col-12">
          <h1 class="text-center mt-4">Image Compressor</h1>
        </div>
        <div class="col-12 py-4">
          <div class="input-group w-50">
            <input class="form-control" id="upload" type="file" placeholder="Upload Image"
              accept="image/jpg, image/png, image/jpeg, image/webp" onchange="imgToData(this)" multiple="">
          </div>
        </div>
      </div>
      <div class="row">
        <div class="col-12 text-center">
          <div class="btn-group">
            <button class="btn btn-outline-secondary" id="downloadImg_btn" type="button" onclick="allImageDown_func()"
              disabled="">Download</button>
          </div>
        </div>
        <div class="col-6 text-end">
          <div id="totalFiles"></div>
        </div>
        <div class="col-6">
          <div id="convertFiles"></div>
        </div>
        <div class="col-6" id="appendImgOrignal"></div>
        <div class="col-6 text-right" id="appendImgConverted"></div>
      </div>
    </div>
  </section>



  <script src="jquery-3.6.0.min.js"></script>


  <script src="bootstrap.bundle.min.js"></script>
  <script src="imgmin.js"></script>
  <script>
    var totalFiles = document.getElementById('totalFiles');
    var uploadItem = document.getElementById('uploadItem');
    var appendImgOrignal = document.getElementById('appendImgOrignal');
    var appendImgConverted = document.getElementById('appendImgConverted');
    var convertFiles = document.getElementById('convertFiles');

    function fileSizeConvert(bytes, decimals = 2) {
      if (bytes === 0) return '0 Bytes';
      const k = 1024;
      const dm = decimals < 0 ? 0 : decimals;
      const sizes = ['Bytes', 'KB', 'MB', 'GB', 'TB', 'PB', 'EB', 'ZB', 'YB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(dm)) + ' ' + sizes[i];
    }

    function clearAll() {
      totalFiles.innerHTML = ''
      uploadItem.innerHTML = ''
      appendImgOrignal.innerHTML = ''
      appendImgConverted.innerHTML = ''
      convertFiles.innerHTML = ''
      document.getElementById('convertImg').style.display = 'none'
      document.getElementById('uploadImg').style.display = 'block'
    }

    function imgToData(input) {
      clearAll()
      document.getElementById('totalFiles').innerHTML = '<h5 class=" my-3"> Total: <strong>' + input.files.length + '</strong></h5>'

      function readFile(index) {
        var Files = new FileReader();
        if (index >= input.files.length) return;

        var file = input.files[index];
        var fname = file.name;
        var fsize = file.size;
        var n = index + 1

        Files.onload = function (event) {
          appendImgOrignal.innerHTML = appendImgOrignal.innerHTML + '<div class="imgWrapper my-3">' + '<img src="' + event.target.result + '" id="uploadImg_' + n + '" width="200" title="' + fname + '"/><strong class="ms-3">' + fileSizeConvert(fsize) + '</strong> </div>'
          readFile(n)

          if (n != input.files.length) {
            uploadItem.innerHTML = 'Upload: <strong>' + n + '</h5>'
          } else {
            document.getElementById('uploadImg').style.display = 'none'
            document.getElementById('convertImg').style.display = 'block'
            uploadItem.innerHTML = '';
          }
        }

        Files.readAsDataURL(file);

        if (n < input.files.length) {
          document.getElementById("loader").style.display = "block";
        }

        if (n === input.files.length) {
          setTimeout(convertImgSize, 2000);
        }
      }
      readFile(0);
    }

    function convertImgSize() {
      var imageSource = $("#appendImgOrignal img")
      var imgsrc;
      $.each(imageSource, function (i) {
        var n = i + 1
        imgsrc = $(this).attr("src");
        fileName = $(this).attr("title");

        var image = new Image();
        image.src = imgsrc;
        let quality = 50,
          output_format = 'jpg';
        let convertedImgSrc = jic.compress(image, quality, output_format).src

        appendImgConverted.innerHTML = appendImgConverted.innerHTML + '<div class="imgWrapper my-3"><strong id="convertId_Img_' + n + '" class="me-3"></strong><a id="downloadImg_' + n + '" onclick="singleImg_downFunc(' + n + ');" href="javascript:void(0);"><img src="' + convertedImgSrc + '" title="' + fileName + '"/></a></div>';

        convertFiles.innerHTML = '<h5 class="my-3"> Convert: <strong>' + n + '</strong></h5>';

        let convertImgSize = new XMLHttpRequest();
        convertImgSize.open("GET", convertedImgSrc, true);
        convertImgSize.responseType = "arraybuffer";
        convertImgSize.onreadystatechange = function () {
          if (this.readyState == this.DONE) {
            document.getElementById('convertId_Img_' + n).innerHTML = fileSizeConvert(this.response.byteLength)
          }
        };
        convertImgSize.send(null);

        if (n === imageSource.length) {
          document.getElementById("downloadImg_btn").disabled = false;
          document.getElementById("loader").style.display = "none";
        }
      });
    }


    function fileDownloadFunc(imgsrc, fileName) {
      var baseString = imgsrc;
      if (baseString.substring(0, 4) != "data") {
        baseString = imgsrc + baseString;
      }
      var a = document.createElement("a");
      a.href = baseString;
      a.download = fileName
      a.click();
    }

    function allImageDown_func() {
      var imageSource = $("#appendImgConverted img")
      var imgsrc;
      $.each(imageSource, function (i) {
        var n = i + 1
        imgsrc = $(this).attr("src");
        fileName = $(this).attr("title");
        fileDownloadFunc(imgsrc, fileName)
      });
    }
    function singleImg_downFunc(n) {
      imgsrc = $('#downloadImg_' + n).children().attr('src');
      fileName = $('#downloadImg_' + n).children().attr("title");
      fileDownloadFunc(imgsrc, fileName)
    }
  </script>
</body>

</html>
