# Netlify configuration for rjimagecompress
#
# Note on "securing" the JavaScript: source that runs in a browser is always
# readable by whoever runs it. Nothing below hides imgmin.js. What it does is
# protect the people using the site - it locks the page down so injected or
# third party code cannot run, and stops the site being framed or sniffed.

[build]
  # dist/ is generated by build.js and holds the obfuscated output. The
  # readable source in the project root is never deployed.
  publish = "dist"
  command = "npm run build"

[[headers]]
  for = "/*"
  [headers.values]
    # Only same-origin code may run. 'unsafe-inline' is required because the
    # page keeps its CSS and its app script inline; everything else is denied.
    # No external script host is allowed at all, so a compromised CDN or an
    # injected <script src> cannot execute.
    Content-Security-Policy = """
      default-src 'self';
      script-src 'self' 'unsafe-inline';
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
      font-src https://fonts.gstatic.com;
      img-src 'self' blob: data:;
      connect-src 'self' blob:;
      media-src 'self' blob:;
      object-src 'none';
      base-uri 'none';
      form-action 'none';
      frame-ancestors 'none';
      upgrade-insecure-requests
    """

    # Cannot be embedded in an iframe anywhere - blocks clickjacking, where
    # your page is layered invisibly under someone else's buttons.
    X-Frame-Options = "DENY"

    # Stops the browser second guessing declared content types.
    X-Content-Type-Options = "nosniff"

    # Do not leak the visited URL to other sites.
    Referrer-Policy = "strict-origin-when-cross-origin"

    # The app needs none of these, so switch them off.
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"

    # HTTPS only for a year, subdomains included.
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

    # Keeps the tab in its own process, so a hostile page in another tab
    # cannot read this one's memory through a side channel.
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"

# The HTML must never be cached, or people keep seeing an old build.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Static assets are safe to cache hard.
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/*.gif"
  [headers.values]
    Cache-Control = "public, max-age=31536000"
